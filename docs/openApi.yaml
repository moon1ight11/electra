openapi: 3.0.3
info:
  title: Electra API
  version: 1.2.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: auth
    description: Аутентификация
  - name: requests
    description: Заявки от клиентов
  - name: orders
    description: Заказы
  - name: reports
    description: Отчёты исполнителей
  - name: statistics
    description: Статистика для владельца
  - name: workers
    description: Исполнители

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cookie

  schemas:
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          example: "+7 (999) 123-45-67"
        password:
          type: string
          example: "owner123"

    CreateWorkerRequest:
      type: object
      required: [name, phone, password]
      properties:
        name:
          type: string
          example: "Новый Электрик"
        phone:
          type: string
          example: "+7 (916) 111-22-33"
        password:
          type: string
          example: "securepass"
        specialization:
          type: string
          example: "Электрик"

    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
          example: "Петя"
        specialization:
          type: string
          example: "Электрик"
        password:
          type: string
          example: "newpass"

    WorkerInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, worker]
        specialization:
          type: string

    CreateRequestInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          example: "Иван Петров"
        phone:
          type: string
          example: "+7 (916) 123-45-67"
        comment:
          type: string
          example: "Нужно подключить дом"

    Request:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        comment:
          type: string
          nullable: true
        status:
          type: string
          enum: [new, converted, cancelled]
        created_at:
          type: string
          format: date-time

    CreateOrderFromRequestInput:
      type: object
      required: [request_id, address, worker_ids]
      properties:
        request_id:
          type: string
          format: uuid
        address:
          type: string
          example: "ул. Ленина, д. 5"
        description:
          type: string
          example: "Подключение дома 220В"
        estimated_price:
          type: number
          example: 20000
        planned_date:
          type: string
          format: date
          example: "2026-07-10"
        worker_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateOrderDirectInput:
      type: object
      required: [address, worker_ids]
      properties:
        address:
          type: string
          example: "ул. Пушкина, д. 10"
        description:
          type: string
          example: "Замена щитка"
        estimated_price:
          type: number
          example: 15000
        planned_date:
          type: string
          format: date
          example: "2026-07-12"
        worker_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateOrderInput:
      type: object
      required: [id, address]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
          example: "ул. Ленина, д. 5"
        description:
          type: string
          example: "Подключение дома 380В"
        estimated_price:
          type: number
          example: 25000
        planned_date:
          type: string
          format: date
          example: "2026-07-15"

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
          nullable: true
        request_phone:
          type: string
          nullable: true
        address:
          type: string
        description:
          type: string
          nullable: true
        estimated_price:
          type: number
          nullable: true
        planned_date:
          type: string
          format: date
          nullable: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    UpdateReportInput:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
          format: uuid
        time_spent:
          type: integer
          example: 180
        earned_amount:
          type: number
          example: 10000
        materials_used:
          type: string
          example: "Кабель ВВГ 3х2.5 - 30м"
        notes:
          type: string
          example: "Всё сделано"

    OrderWorker:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        worker_id:
          type: string
          format: uuid
        time_spent:
          type: integer
          nullable: true
        earned_amount:
          type: number
          nullable: true
        materials_used:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    WorkerStats:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
        worker_name:
          type: string
        orders_count:
          type: integer
        total_earned:
          type: number
        total_time_spent:
          type: integer

    SummaryStats:
      type: object
      properties:
        orders_count:
          type: integer
        total_earned:
          type: number
        total_time_spent:
          type: integer

    Message:
      type: object
      properties:
        message:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string

paths:
  # ==================== HEALTH ====================
  /public/health:
    get:
      tags: [auth]
      summary: Проверка работоспособности сервера
      responses:
        '200':
          description: Сервер работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [auth]
      summary: Вход по телефону и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          headers:
            Set-Cookie:
              schema:
                type: string
                example: cookie=...
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ==================== WORKER ====================
  /worker/logout:
    post:
      tags: [auth]
      summary: Выход
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /worker/me:
    get:
      tags: [auth]
      summary: Информация о текущем пользователе
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerInfo'
    patch:
      tags: [auth]
      summary: Редактирование профиля
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerInfo'

  /worker/workers:
    get:
      tags: [workers]
      summary: Список всех исполнителей (id + имя + специализация)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список исполнителей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerInfo'

  /worker/orders/planned:
    get:
      tags: [orders]
      summary: Заказы в работе текущего исполнителя
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /worker/orders/history:
    get:
      tags: [orders]
      summary: История выполненных заказов исполнителя
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список выполненных заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /worker/orders/{id}/reports:
    get:
      tags: [reports]
      summary: Отчёты всех исполнителей по заказу
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список отчётов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderWorker'

  /worker/orders/report:
    patch:
      tags: [reports]
      summary: Заполнить или обновить отчёт по заказу
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportInput'
      responses:
        '200':
          description: Отчёт обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /worker/orders/{id}/complete:
    patch:
      tags: [orders]
      summary: Завершить заказ (исполнитель)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заказ завершён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ==================== OWNER ====================
  /owner/workers:
    post:
      tags: [workers]
      summary: Создать нового исполнителя
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkerRequest'
      responses:
        '201':
          description: Исполнитель создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerInfo'

  /owner/workers/{id}:
    delete:
      tags: [workers]
      summary: Удалить исполнителя (софт-удаление, статистика сохраняется)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Исполнитель удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /owner/requests/new:
    get:
      tags: [requests]
      summary: Новые заявки
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список новых заявок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'

  /owner/requests/all:
    get:
      tags: [requests]
      summary: Все заявки
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список всех заявок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'

  /owner/requests/convert:
    post:
      tags: [requests]
      summary: Создать заказ из заявки
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderFromRequestInput'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /owner/requests/{id}/cancel:
    patch:
      tags: [requests]
      summary: Отменить заявку
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заявка отменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /owner/orders/direct:
    post:
      tags: [orders]
      summary: Создать заказ без заявки
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderDirectInput'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /owner/orders/planned:
    get:
      tags: [orders]
      summary: Все заказы в работе
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /owner/orders/history:
    get:
      tags: [orders]
      summary: Все выполненные заказы
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Список выполненных заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /owner/orders/{id}/complete:
    patch:
      tags: [orders]
      summary: Завершить заказ (владелец)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Заказ завершён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /owner/orders/edit:
    patch:
      tags: [orders]
      summary: Редактировать заказ
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderInput'
      responses:
        '200':
          description: Заказ обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /owner/orders/{orderId}/workers/{workerId}:
    delete:
      tags: [orders]
      summary: Снять исполнителя с заказа
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: workerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Исполнитель снят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /owner/statistics/workers/{workerId}:
    get:
      tags: [statistics]
      summary: Статистика по исполнителю
      security:
        - cookieAuth: []
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Статистика по исполнителю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerStats'

  /owner/statistics/all:
    get:
      tags: [statistics]
      summary: Статистика по всем исполнителям
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Статистика по всем
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkerStats'

  /owner/statistics/summary:
    get:
      tags: [statistics]
      summary: Сводная статистика по компании
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Сводная статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryStats'

  # ==================== PUBLIC ====================
  /public/requests:
    post:
      tags: [requests]
      summary: Создать заявку с сайта (публичный доступ)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestInput'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'